<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda – Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-calendar-check"></i> Agenda Médica</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm fw-bold"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h2 id="tituloDia" class="fw-bold text-primary mb-0">Citas del día</h2>
      <div class="d-flex gap-2 align-items-center">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-calendar3 text-muted"></i></span>
          <input type="date" id="inputFecha" class="form-control border-start-0 ps-0" style="width: auto;">
        </div>
        <button class="btn btn-outline-primary fw-bold" onclick="cargarCitas()">Filtrar</button>
        <button class="btn btn-primary fw-bold" onclick="abrirOffcanvas()"><i class="bi bi-plus-circle"></i> Nueva Cita</button>
      </div>
    </div>

    <div id="cargando">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <div class="table-container" id="tablaWrap" style="display:none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha y Hora</th>
              <th>Paciente</th>
              <th>Médico</th>
              <th>Motivo</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Offcanvas Panel -->
  <div class="offcanvas offcanvas-end shadow" tabindex="-1" id="offcanvasCita" style="width: 450px;">
    <div class="offcanvas-header bg-light">
      <h5 class="offcanvas-title fw-bold" id="modalTitulo"><i class="bi bi-calendar-plus"></i> Nueva Cita</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="alert alert-danger d-none" id="errorModal"></div>
      <form id="formCita">
        <h6 class="text-muted mb-3 fw-bold">Detalles de la Cita</h6>
        
        <div class="form-floating mb-3">
          <select id="cPaciente" class="form-select" required><option value="">— Cargando... —</option></select>
          <label for="cPaciente">Paciente</label>
        </div>
        
        <div class="form-floating mb-3">
          <select id="cDoctor" class="form-select" required><option value="">— Cargando... —</option></select>
          <label for="cDoctor">Médico</label>
        </div>
        
        <div class="form-floating mb-3">
          <input type="datetime-local" id="cFechaHora" class="form-control" required>
          <label for="cFechaHora">Fecha y Hora</label>
        </div>
        
        <div class="form-floating mb-4">
          <textarea id="cMotivo" class="form-control" placeholder="Motivo de la cita" style="height: 100px" required></textarea>
          <label for="cMotivo">Motivo de la cita</label>
        </div>
        
        <div class="d-flex gap-2 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary w-50 fw-bold" data-bs-dismiss="offcanvas">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnGuardar">Crear Cita</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    let citaOffcanvas;
    document.addEventListener("DOMContentLoaded", () => {
      citaOffcanvas = new bootstrap.Offcanvas(document.getElementById('offcanvasCita'));
    });

    document.getElementById("inputFecha").value = "";

    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarCitas(); }

    async function cargarCitas() {
      const fecha = document.getElementById("inputFecha").value;
      document.getElementById("tituloDia").textContent = fecha ? `Citas del ${fecha}` : "Todas las citas";
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";

      try {
        const url = fecha ? `/citas?fecha=${fecha}` : `/citas`;
        const citas = await apiGet(url);
        renderizarTabla(citas);
      } catch (e) {
        document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    }

    function renderizarTabla(citas) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "block";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!citas.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4"><i class="bi bi-calendar-x fs-4 d-block mb-2"></i> Sin citas registradas</td></tr>`;
        return;
      }

      citas.forEach(c => {
        const dateObj = new Date(c.fecha_hora);
        const dia = dateObj.toLocaleDateString("es-MX", { day: '2-digit', month: 'short' });
        const hora = dateObj.toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
        const tr = document.createElement("tr");
        
        // Colores Bootstrap según estado
        let colorClass = "bg-warning text-dark border-warning";
        if (c.estado === 'completada') colorClass = "bg-success text-white border-success";
        if (c.estado === 'cancelada') colorClass = "bg-danger text-white border-danger";

        tr.innerHTML = `
          <td class="fw-bold"><i class="bi bi-clock text-muted me-1"></i> ${dia} <span class="text-muted fw-normal">${hora}</span></td>
          <td><a href="paciente-detalle.html?id=${c.id_paciente}" class="text-primary text-decoration-none fw-bold"><i class="bi bi-person-fill text-muted me-1"></i> ${c.paciente_nombre || 'Ver'} ${c.paciente_apellidos || ''}</a></td>
          <td class="small"><i class="bi bi-heart-pulse text-muted me-1"></i> ${c.doctor_nombre || c.id_doctor.substring(0,8)}</td>
          <td>${c.motivo}</td>
          <td><span class="badge ${colorClass} border rounded-pill px-3 py-2 text-capitalize">${c.estado}</span></td>
          <td class="text-end">
            <div class="d-flex gap-2 justify-content-end align-items-center">
              <select class="form-select form-select-sm border-0 bg-light fw-bold" style="width: 120px;" onchange="cambiarEstado('${c.id}', this.value.toLowerCase())">
                <option value="pendiente" ${c.estado==="pendiente" ?"selected":""}>Pendiente</option>
                <option value="completada" ${c.estado==="completada"?"selected":""}>Completada</option>
                <option value="cancelada" ${c.estado==="cancelada" ?"selected":""}>Cancelada</option>
              </select>
              <a href="#" class="text-danger text-decoration-none ms-2" title="Eliminar" onclick="eliminarCita('${c.id}'); return false;"><i class="bi bi-trash fs-5"></i></a>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function cambiarEstado(idCita, nuevoEstado) {
      try {
        await apiPatch(`/citas/${idCita}/estado`, { estado: nuevoEstado });
        cargarCitas();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function eliminarCita(idCita) {
      if (!confirm("¿Seguro que deseas eliminar esta cita permanentemente?")) return;
      try {
        await apiDelete(`/citas/${idCita}`);
        cargarCitas();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function abrirOffcanvas() {
      try {
        const [pacientes, doctores] = await Promise.all([apiGet("/pacientes"), apiGet("/doctores")]);
        const selPac = document.getElementById("cPaciente");
        const selDoc = document.getElementById("cDoctor");
        selPac.innerHTML = `<option value="">— Seleccionar paciente —</option>` + pacientes.map(p => `<option value="${p.id}">${p.nombre} ${p.apellidos}</option>`).join("");
        selDoc.innerHTML = `<option value="">— Seleccionar médico —</option>` + doctores.map(d => `<option value="${d.uid}">${d.nombre} ${d.apellidos} – ${d.especialidad || "General"}</option>`).join("");
      } catch (e) {}
      
      document.getElementById("formCita").reset();
      document.getElementById("errorModal").classList.add("d-none");
      citaOffcanvas.show();
    }

    document.getElementById("formCita").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn = document.getElementById("btnGuardar");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;

      try {
        await apiPost("/citas", {
          id_paciente: document.getElementById("cPaciente").value,
          id_doctor: document.getElementById("cDoctor").value,
          fecha_hora: new Date(document.getElementById("cFechaHora").value).toISOString(),
          motivo: document.getElementById("cMotivo").value,
        });
        citaOffcanvas.hide();
        document.getElementById("formCita").reset();
        cargarCitas();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Crear Cita";
      }
    });
  </script>
</body>
</html>
