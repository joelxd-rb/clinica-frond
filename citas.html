<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda – Clínica</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
    nav { background: #1d4ed8; color: #fff; padding: .9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    nav a { color:#fff; text-decoration:none; background:rgba(255,255,255,.15); padding:.3rem .75rem; border-radius:6px; font-size:.85rem; margin-left:.5rem; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; flex-wrap:wrap; gap:.75rem; }
    h2 { color: #1e293b; }
    .controls { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
    .controls input[type=date] { padding:.5rem .85rem; border:1px solid #d1d5db; border-radius:8px; font-size:.9rem; }
    .btn-primary { background:#1d4ed8; color:#fff; padding:.55rem 1.1rem; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:.9rem; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    th { background:#1d4ed8; color:#fff; padding:.75rem 1rem; text-align:left; font-size:.85rem; }
    td { padding:.7rem 1rem; border-bottom:1px solid #e2e8f0; font-size:.875rem; color:#374151; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    td a { color:#1d4ed8; text-decoration:none; font-weight:500; }
    .estado { padding:.2rem .65rem; border-radius:20px; font-size:.75rem; font-weight:700; }
    .Pendiente  { background:#fef3c7; color:#92400e; }
    .En-Curso   { background:#dbeafe; color:#1e40af; }
    .Completada { background:#dcfce7; color:#166534; }
    .Cancelada  { background:#fee2e2; color:#991b1b; }
    select.estado-sel { padding:.3rem .5rem; border:1px solid #d1d5db; border-radius:6px; font-size:.8rem; cursor:pointer; }
    /* Modal nueva cita */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
    .modal-backdrop.activo { display:flex; }
    .modal { background:#fff; border-radius:14px; padding:2rem; width:480px; max-width:95vw; max-height:90vh; overflow-y:auto; }
    .modal h3 { margin-bottom:1.25rem; }
    label { display:block; font-size:.85rem; color:#374151; margin-bottom:.25rem; font-weight:500; }
    input, select, textarea { width:100%; padding:.55rem .85rem; border:1px solid #d1d5db; border-radius:8px; font-size:.9rem; margin-bottom:.85rem; font-family:inherit; }
    textarea { resize:vertical; min-height:70px; }
    .actions { display:flex; gap:.75rem; }
    .btn-cancel { flex:1; padding:.65rem; background:#f1f5f9; border:1px solid #d1d5db; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn-submit { flex:1; padding:.65rem; background:#1d4ed8; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    .error-msg { background:#fee2e2; color:#b91c1c; border-radius:8px; padding:.65rem 1rem; margin-bottom:1rem; font-size:.875rem; display:none; }
    #cargando { text-align:center; padding:2rem; color:#94a3b8; }
  </style>
</head>
<body>
  <nav>
    <h1 style="color:#fff;font-size:1rem">📅 Agenda Médica</h1>
    <div><a href="dashboard.html">⬅ Dashboard</a><a href="#" onclick="cerrarSesion()">Salir</a></div>
  </nav>

  <main>
    <div class="header">
      <h2 id="tituloDia">Citas del día</h2>
      <div class="controls">
        <input type="date" id="inputFecha">
        <button class="btn-primary" onclick="cargarCitas()">Filtrar</button>
        <button class="btn-primary" onclick="abrirModal()">+ Nueva Cita</button>
      </div>
    </div>

    <div id="cargando">Cargando agenda...</div>
    <table id="tablaWrap" style="display:none">
      <thead>
        <tr><th>Hora</th><th>Paciente</th><th>Doctor UID</th><th>Motivo</th><th>Estado</th><th>Cambiar</th></tr>
      </thead>
      <tbody id="tablaCuerpo"></tbody>
    </table>
  </main>

  <!-- Modal: Nueva Cita -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>➕ Nueva Cita</h3>
      <div class="error-msg" id="errorModal"></div>
      <form id="formCita">
        <label>Paciente</label>
        <select id="cPaciente" required>
          <option value="">— Cargando pacientes... —</option>
        </select>
        <label>Médico</label>
        <select id="cDoctor" required>
          <option value="">— Cargando médicos... —</option>
        </select>
        <label>Fecha y Hora</label>
        <input type="datetime-local" id="cFechaHora" required>
        <label>Motivo de la cita</label>
        <textarea id="cMotivo" required placeholder="Describe el motivo de la consulta..."></textarea>
        <div class="actions">
          <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-submit" id="btnGuardar">Crear Cita</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Establecer fecha de hoy en el input al cargar
    const hoy = new Date().toISOString().split("T")[0];
    document.getElementById("inputFecha").value = hoy;

    // ── Inicializar: verificar sesión y cargar citas ──────────────────────────
    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarCitas(); }

    /** Carga las citas del día seleccionado en el input de fecha */
    async function cargarCitas() {
      const fecha = document.getElementById("inputFecha").value || hoy;
      document.getElementById("tituloDia").textContent = `Citas del ${fecha}`;
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";

      try {
        // Llamar a la API con el filtro de fecha
        const citas = await apiGet(`/citas?fecha=${fecha}`);
        renderizarTabla(citas);
      } catch (e) {
        document.getElementById("cargando").textContent = "Error: " + e.message;
      }
    }

    /**
     * Renderiza la tabla de citas.
     * @param {Array} citas
     */
    function renderizarTabla(citas) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "table";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!citas.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8">Sin citas para esta fecha 🎉</td></tr>`;
        return;
      }

      citas.forEach(c => {
        const hora = new Date(c.fecha_hora).toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
        const estadoClass = c.estado.replace(" ", "-");
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${hora}</td>
          <td><a href="paciente-detalle.html?id=${c.id_paciente}">#${c.id_paciente}</a></td>
          <td style="font-size:.8rem">${c.id_doctor.substring(0,8)}…</td>
          <td>${c.motivo}</td>
          <td><span class="estado ${estadoClass}">${c.estado}</span></td>
          <td>
            <select class="estado-sel" onchange="cambiarEstado('${c.id_cita}', this.value)">
              <option ${c.estado==="Pendiente" ?"selected":""}>Pendiente</option>
              <option ${c.estado==="En Curso"  ?"selected":""}>En Curso</option>
              <option ${c.estado==="Completada"?"selected":""}>Completada</option>
              <option ${c.estado==="Cancelada" ?"selected":""}>Cancelada</option>
            </select>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    /**
     * Actualiza el estado de una cita directamente desde el selector de la tabla.
     * @param {string} idCita
     * @param {string} nuevoEstado
     */
    async function cambiarEstado(idCita, nuevoEstado) {
      try {
        await apiPatch(`/citas/${idCita}`, { estado: nuevoEstado });
        cargarCitas(); // Recargar para reflejar el cambio
      } catch (e) { alert("Error: " + e.message); }
    }

    // ── Modal nueva cita ─────────────────────────────────────────────────────
    async function abrirModal() {
      // Cargar listas de pacientes y doctores para los selectores
      try {
        const [pacientes, doctores] = await Promise.all([
          apiGet("/pacientes"),
          apiGet("/doctores"),
        ]);

        const selPac = document.getElementById("cPaciente");
        const selDoc = document.getElementById("cDoctor");

        selPac.innerHTML = `<option value="">— Seleccionar paciente —</option>` +
          pacientes.map(p => `<option value="${p.id_paciente}">${p.nombre} ${p.apellidos}</option>`).join("");

        selDoc.innerHTML = `<option value="">— Seleccionar médico —</option>` +
          doctores.map(d => `<option value="${d.uid}">${d.nombre} ${d.apellidos} – ${d.especialidad || "General"}</option>`).join("");
      } catch (e) { console.error("Error cargando selectors:", e); }

      document.getElementById("modalBackdrop").classList.add("activo");
    }

    function cerrarModal() { document.getElementById("modalBackdrop").classList.remove("activo"); }

    document.getElementById("formCita").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn    = document.getElementById("btnGuardar");
      errDiv.style.display = "none";
      btn.disabled = true; btn.textContent = "Creando...";

      const body = {
        id_paciente: document.getElementById("cPaciente").value,
        id_doctor:   document.getElementById("cDoctor").value,
        // Convertir datetime-local a ISO 8601 que entiende la API
        fecha_hora:  new Date(document.getElementById("cFechaHora").value).toISOString(),
        motivo:      document.getElementById("cMotivo").value,
      };

      try {
        await apiPost("/citas", body);
        cerrarModal();
        document.getElementById("formCita").reset();
        cargarCitas(); // Refrescar la agenda
      } catch (err) {
        // Si hay colisión de horario, el backend responde 409 con mensaje claro
        errDiv.textContent = "⚠️ " + err.message;
        errDiv.style.display = "block";
      } finally {
        btn.disabled = false; btn.textContent = "Crear Cita";
      }
    });
  </script>
</body>
</html>
