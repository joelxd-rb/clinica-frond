<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda – Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">📅 Agenda Médica</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm fw-bold">⬅ Dashboard</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h2 id="tituloDia" class="fw-bold text-primary mb-0">Citas del día</h2>
      <div class="d-flex gap-2 align-items-center">
        <input type="date" id="inputFecha" class="form-control" style="width: auto;">
        <button class="btn btn-secondary fw-bold" onclick="cargarCitas()">Filtrar</button>
        <button class="btn btn-primary fw-bold" onclick="abrirModal()">+ Nueva Cita</button>
      </div>
    </div>

    <div id="cargando">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <div class="table-container" id="tablaWrap" style="display:none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Hora</th>
              <th>Paciente ID</th>
              <th>Doctor UID</th>
              <th>Motivo</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal card p-4 shadow-lg border-0" style="max-width: 500px; width: 100%;">
      <h3 class="fw-bold mb-4">➕ Nueva Cita</h3>
      <div class="alert alert-danger d-none" id="errorModal"></div>
      <form id="formCita">
        <div class="mb-3">
          <label class="form-label fw-bold">Paciente</label>
          <select id="cPaciente" class="form-select" required><option value="">— Cargando... —</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Médico</label>
          <select id="cDoctor" class="form-select" required><option value="">— Cargando... —</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Fecha y Hora</label>
          <input type="datetime-local" id="cFechaHora" class="form-control" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Motivo de la cita</label>
          <textarea id="cMotivo" class="form-control" rows="3" required></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary w-50 fw-bold" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnGuardar">Crear Cita</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const hoy = new Date().toISOString().split("T")[0];
    document.getElementById("inputFecha").value = hoy;

    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarCitas(); }

    async function cargarCitas() {
      const fecha = document.getElementById("inputFecha").value || hoy;
      document.getElementById("tituloDia").textContent = `Citas del ${fecha}`;
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";

      try {
        const citas = await apiGet(`/citas?fecha=${fecha}`);
        renderizarTabla(citas);
      } catch (e) {
        document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    }

    function renderizarTabla(citas) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "block";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!citas.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Sin citas para esta fecha 🎉</td></tr>`;
        return;
      }

      citas.forEach(c => {
        const hora = new Date(c.fecha_hora).toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
        const tr = document.createElement("tr");
        
        // Colores Bootstrap según estado
        let colorClass = "bg-warning text-dark";
        if (c.estado === 'completada') colorClass = "bg-success text-white";
        if (c.estado === 'cancelada') colorClass = "bg-danger text-white";

        tr.innerHTML = `
          <td class="fw-bold">${hora}</td>
          <td><a href="paciente-detalle.html?id=${c.id}" class="text-primary text-decoration-none fw-bold">#${c.id.substring(0,8)}</a></td>
          <td class="small text-muted">${c.id_doctor.substring(0,8)}…</td>
          <td>${c.motivo}</td>
          <td><span class="badge ${colorClass} rounded-pill px-3 py-2 text-capitalize">${c.estado}</span></td>
          <td>
            <div class="d-flex gap-2">
              <select class="form-select form-select-sm" style="width: auto;" onchange="cambiarEstado('${c.id}', this.value.toLowerCase())">
                <option value="pendiente" ${c.estado==="pendiente" ?"selected":""}>Pendiente</option>
                <option value="completada" ${c.estado==="completada"?"selected":""}>Completada</option>
                <option value="cancelada" ${c.estado==="cancelada" ?"selected":""}>Cancelada</option>
              </select>
              <button class="btn btn-sm btn-danger fw-bold" onclick="eliminarCita('${c.id}')">Eliminar</button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function cambiarEstado(idCita, nuevoEstado) {
      try {
        await apiPatch(`/citas/${idCita}/estado`, { estado: nuevoEstado });
        cargarCitas();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function eliminarCita(idCita) {
      if (!confirm("¿Seguro que deseas eliminar esta cita permanentemente?")) return;
      try {
        await apiDelete(`/citas/${idCita}`);
        cargarCitas();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function abrirModal() {
      try {
        const [pacientes, doctores] = await Promise.all([apiGet("/pacientes"), apiGet("/doctores")]);
        const selPac = document.getElementById("cPaciente");
        const selDoc = document.getElementById("cDoctor");
        selPac.innerHTML = `<option value="">— Seleccionar paciente —</option>` + pacientes.map(p => `<option value="${p.id}">${p.nombre} ${p.apellidos}</option>`).join("");
        selDoc.innerHTML = `<option value="">— Seleccionar médico —</option>` + doctores.map(d => `<option value="${d.uid}">${d.nombre} ${d.apellidos} – ${d.especialidad || "General"}</option>`).join("");
      } catch (e) {}
      document.getElementById("modalBackdrop").classList.add("activo");
    }

    function cerrarModal() { document.getElementById("modalBackdrop").classList.remove("activo"); }

    document.getElementById("formCita").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn = document.getElementById("btnGuardar");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.textContent = "Creando...";

      try {
        await apiPost("/citas", {
          id_paciente: document.getElementById("cPaciente").value,
          id_doctor: document.getElementById("cDoctor").value,
          fecha_hora: new Date(document.getElementById("cFechaHora").value).toISOString(),
          motivo: document.getElementById("cMotivo").value,
        });
        cerrarModal();
        document.getElementById("formCita").reset();
        cargarCitas();
      } catch (err) {
        errDiv.textContent = "⚠️ " + err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Crear Cita";
      }
    });
  </script>
</body>
</html>
