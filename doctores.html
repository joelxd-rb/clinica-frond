<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médicos – Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">👨‍⚕️ Médicos Registrados</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm fw-bold">⬅ Dashboard</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-primary mb-0">Directorio Médico</h2>
      <button class="btn btn-primary fw-bold" onclick="abrirModal()">+ Nuevo Doctor</button>
    </div>

    <div id="cargando">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <div class="table-container" id="tablaWrap" style="display:none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Especialidad</th>
              <th>Cédula</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="custom-backdrop" id="modalBackdrop">
    <div class="custom-modal card p-4 shadow-lg border-0" style="max-width: 600px; width: 100%;">
      <h3 class="fw-bold mb-4">➕ Registrar Nuevo Doctor</h3>
      <div class="alert alert-danger d-none" id="errorModal"></div>
      <form id="formDoctor">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Nombre(s)</label>
            <input type="text" name="nombre" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Apellidos</label>
            <input type="text" name="apellidos" class="form-control" required>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Especialidad</label>
            <input type="text" name="especialidad" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Cédula Profesional</label>
            <input type="text" name="cedula_profesional" class="form-control">
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Teléfono</label>
          <input type="tel" name="telefono" class="form-control">
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary w-50 fw-bold" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnGuardar">Guardar Doctor</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarDoctores(); }

    async function cargarDoctores() {
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";

      try {
        const doctores = await apiGet("/doctores");
        document.getElementById("cargando").style.display = "none";
        document.getElementById("tablaWrap").style.display = "block";
        const tbody = document.getElementById("tablaCuerpo");
        tbody.innerHTML = "";

        if (!doctores.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Sin médicos registrados</td></tr>`;
          return;
        }

        doctores.forEach(d => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="fw-bold">${d.nombre} ${d.apellidos}</td>
            <td>${d.especialidad || "—"}</td>
            <td>${d.cedula_profesional || "—"}</td>
            <td>${d.telefono || "—"}</td>
            <td><span class="badge ${d.activo ? 'bg-success' : 'bg-secondary'} rounded-pill px-3 py-2">${d.activo ? "Activo" : "Inactivo"}</span></td>
            <td>
              <div class="d-flex gap-2">
                <button class="btn btn-sm ${d.activo ? 'btn-outline-warning' : 'btn-outline-success'} fw-bold" 
                  onclick="toggleEstado('${d.uid}', ${!d.activo})">
                  ${d.activo ? "Suspender" : "Activar"}
                </button>
                <button class="btn btn-sm btn-danger fw-bold" onclick="eliminarDoctor('${d.uid}')">Eliminar</button>
              </div>
            </td>`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    }

    async function toggleEstado(uid, nuevoEstado) {
      try {
        await apiPut(`/usuarios/${uid}/estado`, { activo: nuevoEstado });
        cargarDoctores();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function eliminarDoctor(uid) {
      if (!confirm("¿Seguro que deseas eliminar este doctor permanentemente? Se eliminarán todas sus citas e historiales (si aplica).")) return;
      try {
        await apiDelete(`/doctores/${uid}`);
        cargarDoctores();
      } catch (e) { alert("Error: " + e.message); }
    }

    function abrirModal() { document.getElementById("modalBackdrop").classList.add("activo"); }
    function cerrarModal() { document.getElementById("modalBackdrop").classList.remove("activo"); }

    document.getElementById("formDoctor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn = document.getElementById("btnGuardar");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.textContent = "Guardando...";

      const datos = Object.fromEntries(new FormData(e.target));
      try {
        await apiPost("/doctores", datos);
        cerrarModal();
        e.target.reset();
        cargarDoctores();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar Doctor";
      }
    });
  </script>
</body>
</html>
