<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médicos – Clínica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-person-badge"></i> Médicos Registrados</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm fw-bold"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-primary mb-0">Directorio Médico</h2>
      <button class="btn btn-primary fw-bold" onclick="abrirOffcanvas()"><i class="bi bi-plus-circle"></i> Nuevo Doctor</button>
    </div>

    <div id="cargando">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <div class="table-container" id="tablaWrap" style="display:none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre</th>
              <th>Especialidad</th>
              <th>Cédula</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Offcanvas Panel -->
  <div class="offcanvas offcanvas-end shadow" tabindex="-1" id="offcanvasDoctor" aria-labelledby="offcanvasDoctorLabel" style="width: 450px;">
    <div class="offcanvas-header bg-light">
      <h5 class="offcanvas-title fw-bold" id="offcanvasDoctorLabel"><i class="bi bi-person-plus"></i> Nuevo Doctor</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="alert alert-danger d-none" id="errorModal"></div>
      
      <form id="formDoctor">
        <h6 class="text-muted mb-3 fw-bold">Credenciales de Acceso</h6>
        <div class="form-floating mb-3">
          <input type="email" name="email" class="form-control" id="fEmail" placeholder="Correo" required>
          <label for="fEmail">Correo Electrónico</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" name="password" class="form-control" id="fPass" placeholder="Clave" required minlength="6">
          <label for="fPass">Contraseña temporal</label>
        </div>

        <h6 class="text-muted mb-3 fw-bold">Datos Personales</h6>
        <div class="form-floating mb-3">
          <input type="text" name="nombre" class="form-control" id="fNombre" placeholder="Nombre" required>
          <label for="fNombre">Nombre(s)</label>
        </div>
        <div class="form-floating mb-3">
          <input type="text" name="apellidos" class="form-control" id="fApellidos" placeholder="Apellidos" required>
          <label for="fApellidos">Apellidos</label>
        </div>
        <div class="form-floating mb-3">
          <input type="text" name="especialidad" class="form-control" id="fEspecialidad" placeholder="Especialidad">
          <label for="fEspecialidad">Especialidad</label>
        </div>
        <div class="form-floating mb-3">
          <input type="text" name="cedula_profesional" class="form-control" id="fCedula" placeholder="Cédula">
          <label for="fCedula">Cédula Profesional</label>
        </div>
        <div class="form-floating mb-4">
          <input type="tel" name="telefono" class="form-control" id="fTel" placeholder="Tel">
          <label for="fTel">Teléfono de contacto</label>
        </div>
        
        <div class="d-flex gap-2 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary w-50 fw-bold" data-bs-dismiss="offcanvas">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    let doctorOffcanvas;

    document.addEventListener("DOMContentLoaded", () => {
      doctorOffcanvas = new bootstrap.Offcanvas(document.getElementById('offcanvasDoctor'));
    });

    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarDoctores(); }

    async function cargarDoctores() {
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";

      try {
        const doctores = await apiGet("/doctores");
        document.getElementById("cargando").style.display = "none";
        document.getElementById("tablaWrap").style.display = "block";
        const tbody = document.getElementById("tablaCuerpo");
        tbody.innerHTML = "";

        if (!doctores.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Sin médicos registrados</td></tr>`;
          return;
        }

        doctores.forEach(d => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="fw-bold"><i class="bi bi-person-fill text-muted me-1"></i> ${d.nombre} ${d.apellidos}</td>
            <td>${d.especialidad || "—"}</td>
            <td><span class="text-muted small">${d.cedula_profesional || "—"}</span></td>
            <td>${d.telefono || "—"}</td>
            <td><span class="badge ${d.activo ? 'bg-success' : 'bg-secondary'} rounded-pill px-3 py-2">${d.activo ? "Activo" : "Inactivo"}</span></td>
            <td class="text-end">
              <a href="#" class="${d.activo ? 'text-warning' : 'text-success'} me-3 text-decoration-none" title="${d.activo ? 'Suspender' : 'Activar'}" onclick="toggleEstado('${d.uid}', ${!d.activo}); return false;">
                <i class="bi ${d.activo ? 'bi-pause-circle' : 'bi-play-circle'} fs-5"></i>
              </a>
              <a href="#" class="text-danger text-decoration-none" title="Eliminar" onclick="eliminarDoctor('${d.uid}'); return false;">
                <i class="bi bi-trash fs-5"></i>
              </a>
            </td>`;
          tbody.appendChild(tr);
        });
      } catch (e) {
        document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`;
      }
    }

    async function toggleEstado(uid, nuevoEstado) {
      try {
        await apiPut(`/usuarios/${uid}/estado`, { activo: nuevoEstado });
        cargarDoctores();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function eliminarDoctor(uid) {
      if (!confirm("¿Seguro que deseas eliminar este doctor permanentemente? Se eliminarán todas sus citas e historiales (si aplica).")) return;
      try {
        await apiDelete(`/doctores/${uid}`);
        cargarDoctores();
      } catch (e) { alert("Error: " + e.message); }
    }

    function abrirOffcanvas() { 
      document.getElementById("formDoctor").reset();
      document.getElementById("errorModal").classList.add("d-none");
      doctorOffcanvas.show(); 
    }

    document.getElementById("formDoctor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn = document.getElementById("btnGuardar");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;

      const datos = Object.fromEntries(new FormData(e.target));
      try {
        await apiPost("/doctores", datos);
        doctorOffcanvas.hide();
        cargarDoctores();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar";
      }
    });
  </script>
</body>
</html>
