<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctores – Clínica</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
    nav { background: #1d4ed8; color: #fff; padding: .9rem 1.5rem;
          display: flex; align-items: center; justify-content: space-between; }
    nav a { color:#fff; text-decoration:none; background:rgba(255,255,255,.15);
            padding:.3rem .75rem; border-radius:6px; font-size:.85rem; margin-left:.5rem; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem; }
    h2 { color: #1e293b; }
    .btn-primary { background:#1d4ed8; color:#fff; padding:.55rem 1.2rem;
                   border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:.9rem; }
    /* Modal de nuevo doctor */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
    .modal-backdrop.activo { display:flex; }
    .modal { background:#fff; border-radius:14px; padding:2rem; width:480px; max-width:95vw;
             max-height:90vh; overflow-y:auto; }
    .modal h3 { color:#1e293b; margin-bottom:1.25rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
    label { display:block; font-size:.85rem; color:#374151; margin-bottom:.25rem; font-weight:500; }
    input { width:100%; padding:.55rem .85rem; border:1px solid #d1d5db;
            border-radius:8px; font-size:.9rem; margin-bottom:.85rem; }
    input:focus { outline:none; border-color:#1d4ed8; }
    .actions { display:flex; gap:.75rem; margin-top:.5rem; }
    .btn-cancel { flex:1; padding:.65rem; background:#f1f5f9; border:1px solid #d1d5db;
                  border-radius:8px; cursor:pointer; font-weight:600; }
    .btn-submit { flex:1; padding:.65rem; background:#1d4ed8; color:#fff;
                  border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    .error-msg { background:#fee2e2; color:#b91c1c; border-radius:8px;
                 padding:.65rem 1rem; margin-bottom:1rem; font-size:.875rem; display:none; }
    /* Tabla */
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px;
            overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    th { background:#1d4ed8; color:#fff; padding:.75rem 1rem; text-align:left; font-size:.85rem; }
    td { padding:.7rem 1rem; border-bottom:1px solid #e2e8f0; font-size:.9rem; color:#374151; }
    tr:last-child td { border-bottom:none; }
    .badge { padding:.2rem .6rem; border-radius:20px; font-size:.75rem; font-weight:600; }
    .activo  { background:#dcfce7; color:#166534; }
    .inactivo { background:#fee2e2; color:#991b1b; }
    .btn-toggle { font-size:.8rem; padding:.3rem .7rem; border:none; border-radius:6px; cursor:pointer; }
    .btn-susp { background:#fef3c7; color:#92400e; }
    .btn-act  { background:#dcfce7; color:#166534; }
    #cargando { text-align:center; padding:2rem; color:#94a3b8; }
  </style>
</head>
<body>
  <nav>
    <h1 style="color:#fff;font-size:1rem">👨‍⚕️ Directorio Médico</h1>
    <div><a href="dashboard.html">⬅ Dashboard</a><a href="#" onclick="cerrarSesion()">Salir</a></div>
  </nav>

  <main>
    <div class="header">
      <h2>Médicos registrados</h2>
      <button class="btn-primary" onclick="abrirModal()">+ Nuevo Doctor</button>
    </div>

    <div id="cargando">Cargando lista de doctores...</div>
    <table id="tablaWrap" style="display:none">
      <thead>
        <tr><th>Nombre</th><th>Especialidad</th><th>Cédula</th><th>Teléfono</th><th>Estado</th><th>Acción</th></tr>
      </thead>
      <tbody id="tablaCuerpo"></tbody>
    </table>
  </main>

  <!-- Modal: Nuevo Doctor -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3>➕ Registrar Nuevo Doctor</h3>
      <div class="error-msg" id="errorModal"></div>
      <form id="formDoctor">
        <div class="grid2">
          <div><label>Email</label><input type="email" name="email" required placeholder="dr@clinica.com"></div>
          <div><label>Contraseña</label><input type="password" name="password" required placeholder="••••••••" minlength="6"></div>
        </div>
        <div class="grid2">
          <div><label>Nombre(s)</label><input type="text" name="nombre" required></div>
          <div><label>Apellidos</label><input type="text" name="apellidos" required></div>
        </div>
        <div class="grid2">
          <div><label>Especialidad</label><input type="text" name="especialidad" placeholder="Cardiología"></div>
          <div><label>Cédula Profesional</label><input type="text" name="cedula_profesional"></div>
        </div>
        <label>Teléfono</label><input type="tel" name="telefono" placeholder="+52 55 0000 0000">
        <div class="actions">
          <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-submit" id="btnGuardar">Guardar Doctor</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // ── Cargar lista de doctores al iniciar ──────────────────────────────────
    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarDoctores(); }

    /**
     * Obtiene y renderiza la lista de doctores activos desde la API.
     */
    async function cargarDoctores() {
      try {
        const doctores = await apiGet("/doctores");
        renderizarTabla(doctores);
      } catch (e) {
        document.getElementById("cargando").textContent = "Error: " + e.message;
      }
    }

    /**
     * Renderiza la tabla HTML con los datos de los doctores.
     * @param {Array} doctores - Array de objetos doctor desde la API
     */
    function renderizarTabla(doctores) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "table";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!doctores.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#94a3b8">Sin médicos registrados</td></tr>`;
        return;
      }

      doctores.forEach(d => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.nombre} ${d.apellidos}</td>
          <td>${d.especialidad || "—"}</td>
          <td>${d.cedula_profesional || "—"}</td>
          <td>${d.telefono || "—"}</td>
          <td><span class="badge ${d.activo ? "activo" : "inactivo"}">${d.activo ? "Activo" : "Inactivo"}</span></td>
          <td>
            <button class="btn-toggle ${d.activo ? "btn-susp" : "btn-act"}"
              onclick="toggleEstado('${d.uid}', ${!d.activo})">
              ${d.activo ? "Suspender" : "Activar"}
            </button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    /**
     * Activa o suspende la cuenta de un usuario.
     * @param {string} uid - UID del usuario en Firebase Auth
     * @param {boolean} nuevoEstado - true=activar, false=suspender
     */
    async function toggleEstado(uid, nuevoEstado) {
      try {
        await apiPut(`/usuarios/${uid}/estado`, { activo: nuevoEstado });
        cargarDoctores(); // Recargar la tabla
      } catch (e) { alert("Error: " + e.message); }
    }

    // ── Modal de nuevo doctor ────────────────────────────────────────────────
    function abrirModal() { document.getElementById("modalBackdrop").classList.add("activo"); }
    function cerrarModal() { document.getElementById("modalBackdrop").classList.remove("activo"); }

    document.getElementById("formDoctor").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn    = document.getElementById("btnGuardar");
      errDiv.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Guardando...";

      // Recopilar datos del formulario en un objeto
      const datos = Object.fromEntries(new FormData(e.target));

      try {
        // Llamar al endpoint POST /api/doctores con los datos del formulario
        await apiPost("/doctores", datos);
        cerrarModal();
        e.target.reset();
        cargarDoctores(); // Recargar la tabla para mostrar el nuevo doctor
      } catch (err) {
        errDiv.textContent = "⚠️ " + err.message;
        errDiv.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar Doctor";
      }
    });
  </script>
</body>
</html>
