<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Clínica</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 450px;
      padding: 3rem;
    }
  </style>
</head>
<body>
  <div class="card login-card text-center">
    <div class="mb-4">
      <img src="img/logo.jpg" alt="Logo Clínica" class="rounded-circle shadow-sm" width="100" height="100" style="object-fit:cover">
    </div>
    <h2 class="fw-bold mb-4 text-primary">Acceso al Sistema</h2>
    
    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

    <form id="formLogin">
      <div class="mb-3 text-start">
        <label class="form-label fw-bold">Correo electrónico</label>
        <input type="email" id="email" class="form-control form-control-lg" required>
      </div>
      <div class="mb-4 text-start">
        <label class="form-label fw-bold">Contraseña</label>
        <input type="password" id="password" class="form-control form-control-lg" required>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100" id="btnSubmit">
        Iniciar sesión
      </button>
    </form>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (estaAutenticado()) {
      window.location.href = "dashboard.html";
    }

    const formLogin = document.getElementById("formLogin");
    const btnSubmit = document.getElementById("btnSubmit");
    const errorMsg  = document.getElementById("errorMsg");

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = "Cargando...";
      errorMsg.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const respuesta = await apiPost("/auth/login", { email, password });
        guardarToken(respuesta.token);
        window.location.href = "dashboard.html";
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("d-none");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Iniciar sesión";
      }
    });
  </script>
</body>
</html>
