<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – Clínica</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 14px; padding: 2.5rem;
            width: 360px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
    .logo { text-align: center; margin-bottom: 1.75rem; }
    .logo h1 { color: #1d4ed8; font-size: 1.7rem; }
    .logo p  { color: #64748b; font-size: .85rem; margin-top: .25rem; }
    label { display: block; font-size: .85rem; color: #374151;
            margin-bottom: .35rem; font-weight: 500; }
    input { width: 100%; padding: .65rem .95rem; border: 1px solid #d1d5db;
            border-radius: 8px; font-size: .95rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(29,78,216,.15); }
    button { width: 100%; padding: .78rem; background: #1d4ed8; color: #fff;
             border: none; border-radius: 8px; font-size: 1rem;
             cursor: pointer; font-weight: 600; transition: background .2s; }
    button:hover { background: #1e40af; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .error { background: #fee2e2; color: #b91c1c; border-radius: 8px;
             padding: .7rem 1rem; margin-bottom: 1rem; font-size: .875rem; display: none; }
  </style>
</head>
<body>

  <!-- ── Tarjeta de login ─────────────────────────────────────── -->
  <div class="card">
    <div class="logo">
      <h1>🏥 Clínica</h1>
      <p>Sistema de Gestión Médica</p>
    </div>

    <!-- Mensaje de error (oculto por defecto) -->
    <div class="error" id="msgError"></div>

    <form id="formLogin">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="admin@clinica.com" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" required>

      <button type="submit" id="btnLogin">Iniciar Sesión</button>
    </form>
  </div>

  <!-- Configuración de URL de la API (sin Firebase) -->
  <script src="js/firebase-config.js"></script>
  <!-- Helper de peticiones HTTP con JWT -->
  <script src="js/api.js"></script>

  <script>
    // ── Lógica del formulario de login ─────────────────────────────────────

    const formLogin = document.getElementById("formLogin");
    const btnLogin  = document.getElementById("btnLogin");
    const msgError  = document.getElementById("msgError");

    /**
     * Muestra un mensaje de error en el formulario.
     * @param {string} texto - Mensaje a mostrar
     */
    function mostrarError(texto) {
      msgError.textContent = "⚠️ " + texto;
      msgError.style.display = "block";
    }

    /**
     * Activa o desactiva el estado de carga del botón.
     * @param {boolean} cargando - true = mostrando spinner
     */
    function setCargando(cargando) {
      btnLogin.disabled = cargando;
      btnLogin.textContent = cargando ? "Iniciando sesión..." : "Iniciar Sesión";
      msgError.style.display = "none";
    }

    // Si ya hay una sesión activa (token válido en localStorage), redirigir
    if (estaAutenticado()) {
      window.location.href = "/dashboard.html";
    }

    // Manejar el envío del formulario de login
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      setCargando(true);

      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        // Llamar al endpoint POST /api/auth/login de nuestra API en Render
        // El servidor valida las credenciales y retorna un JWT si son correctas
        const respuesta = await apiPost("/auth/login", { email, password });

        // Guardar el JWT recibido en localStorage para usarlo en futuras peticiones
        guardarToken(respuesta.token);

        // Redirigir al dashboard según el rol del usuario
        const claims = decodificarToken();
        window.location.href = "/dashboard.html";

      } catch (error) {
        // Mostrar el mensaje de error retornado por la API
        mostrarError(error.message || "Credenciales incorrectas");
        setCargando(false);
      }
    });
  </script>
</body>
</html>
