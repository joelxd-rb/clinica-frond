<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expediente Médico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .timeline-item {
      border-left: 3px solid var(--bs-primary);
      padding-left: 1rem;
      position: relative;
      margin-bottom: 1.5rem;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 0;
      width: 15px;
      height: 15px;
      background: white;
      border: 3px solid var(--bs-primary);
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#" id="navTitulo">📋 Expediente</a>
      <div class="d-flex align-items-center gap-3">
        <a href="pacientes.html" class="btn btn-outline-light btn-sm fw-bold">⬅ Volver a Pacientes</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <!-- Ficha demográfica -->
    <div class="card p-4 mb-4" id="fichaCard">
      <div class="skeleton skeleton-title"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <!-- Historial médico -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h3 class="fw-bold text-primary mb-0">📜 Historial Médico</h3>
        <button class="btn btn-primary fw-bold" onclick="abrirModalConsulta()">+ Registrar Consulta</button>
      </div>
      <div id="historialContainer">
        <div class="skeleton skeleton-row" style="height:60px"></div>
        <div class="skeleton skeleton-row" style="height:60px"></div>
      </div>
    </div>
  </main>

  <!-- Modal: Registrar Consulta -->
  <div class="modal-backdrop" id="modalConsulta">
    <div class="modal card p-4 shadow-lg border-0" style="max-width: 600px; width: 100%;">
      <h3 class="fw-bold mb-4">🩺 Registrar Consulta</h3>
      <div class="alert alert-danger d-none" id="errorConsulta"></div>
      <form id="formConsulta">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">Peso (kg)</label>
            <input type="number" step="0.1" id="cPeso" class="form-control" placeholder="70.5">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">Presión arterial</label>
            <input type="text" id="cPresion" class="form-control" placeholder="120/80">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Diagnóstico *</label>
          <textarea id="cDiagnostico" class="form-control" required rows="2" placeholder="Describe el diagnóstico..."></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Tratamiento *</label>
          <textarea id="cTratamiento" class="form-control" required rows="2" placeholder="Medicamentos, indicaciones..."></textarea>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Observaciones / Notas adicionales</label>
          <textarea id="cObservaciones" class="form-control" rows="2" placeholder="(Opcional)"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary w-50 fw-bold" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnConsulta">Guardar Consulta</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const idPaciente = params.get("id");

    if (!idPaciente) window.location.href = "pacientes.html";

    if (!estaAutenticado()) { window.location.href = "index.html"; } else { Promise.all([cargarPaciente(), cargarHistorial()]); }

    async function cargarPaciente() {
      try {
        const p = await apiGet(`/pacientes/${idPaciente}`);
        document.getElementById("navTitulo").textContent = `📋 ${p.nombre} ${p.apellidos}`;
        document.getElementById("fichaCard").innerHTML = `
          <div class="mb-4 border-bottom pb-3">
            <h2 class="fw-bold mb-1">${p.nombre} ${p.apellidos}</h2>
            <p class="text-muted small mb-0">ID: ${p.id}</p>
          </div>
          <div class="row g-4">
            <div class="col-md-3 col-6">
              <label class="text-muted fw-bold small text-uppercase">Fecha de Nacimiento</label>
              <p class="mb-0 fs-5">${p.fecha_nacimiento || "—"}</p>
            </div>
            <div class="col-md-3 col-6">
              <label class="text-muted fw-bold small text-uppercase">Sexo</label>
              <p class="mb-0 fs-5">${p.sexo || "—"}</p>
            </div>
            <div class="col-md-3 col-6">
              <label class="text-muted fw-bold small text-uppercase">Teléfono</label>
              <p class="mb-0 fs-5">${p.telefono || "—"}</p>
            </div>
            <div class="col-md-3 col-6">
              <label class="text-muted fw-bold small text-uppercase">Dirección</label>
              <p class="mb-0 fs-5">${p.direccion || "—"}</p>
            </div>
          </div>`;
      } catch (e) {
        document.getElementById("fichaCard").innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
      }
    }

    async function cargarHistorial() {
      const container = document.getElementById("historialContainer");
      try {
        const historial = await apiGet(`/historial/paciente/${idPaciente}`);

        if (!historial.length) {
          container.innerHTML = `<div class="text-center text-muted py-5">Sin registros médicos aún</div>`;
          return;
        }

        container.innerHTML = historial.map(h => `
          <div class="timeline-item">
            <h5 class="fw-bold mb-1">📅 ${new Date(h.fecha_consulta).toLocaleString("es-MX", {dateStyle:"long", timeStyle:"short"})}</h5>
            <p class="text-primary fw-bold mb-2">🩺 ${h.diagnostico}</p>
            <p class="mb-2"><strong>Tratamiento:</strong> ${h.tratamiento}</p>
            <div class="d-flex flex-wrap gap-2 mb-2">
              ${h.notas && h.notas.includes('peso_kg:') ? `<span class="badge bg-secondary">⚖️ Registró signos vitales</span>` : ""}
            </div>
            ${h.notas ? `<div class="bg-light p-3 rounded text-muted fst-italic">💬 ${h.notas}</div>` : ""}
          </div>`).join("");
      } catch (e) {
        container.innerHTML = `<div class="alert alert-danger">Error al cargar historial: ${e.message}</div>`;
      }
    }

    function abrirModalConsulta() { document.getElementById("modalConsulta").classList.add("activo"); }
    function cerrarModal() { document.getElementById("modalConsulta").classList.remove("activo"); }

    document.getElementById("formConsulta").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorConsulta");
      const btn = document.getElementById("btnConsulta");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.textContent = "Guardando...";

      // Para ser compatible con el backend actual que guarda el peso y presion en las notas
      const peso = document.getElementById("cPeso").value;
      const presion = document.getElementById("cPresion").value;
      const obs = document.getElementById("cObservaciones").value;
      
      let notasAdicionales = obs;
      if (peso) notasAdicionales += ` [peso_kg: ${peso}]`;
      if (presion) notasAdicionales += ` [presion: ${presion}]`;

      const body = {
        id_paciente: idPaciente,
        diagnostico: document.getElementById("cDiagnostico").value,
        tratamiento: document.getElementById("cTratamiento").value,
        observaciones: notasAdicionales.trim() || null,
        peso_kg: peso || null,
        presion_arterial: presion || null
      };

      try {
        await apiPost("/historial", body);
        cerrarModal();
        document.getElementById("formConsulta").reset();
        cargarHistorial();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar Consulta";
      }
    });
  </script>
</body>
</html>
