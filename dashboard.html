<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Clínica</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS (Marca de agua y ajustes) -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">🏥 Clínica Panel</a>
      <div class="d-flex align-items-center">
        <span class="text-light me-4" id="navInfo">Cargando...</span>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <h2 id="bienvenida" class="mb-5 text-primary fw-bold">Cargando...</h2>
    
    <div class="row g-4">
      <!-- Admin Only -->
      <div class="col-md-4 admin-only" style="display:none;">
        <div class="card h-100 text-center p-4" role="button" onclick="window.location.href='doctores.html'">
          <div class="card-body">
            <h1 class="display-4 mb-3">👨‍⚕️</h1>
            <h4 class="card-title fw-bold">Directorio Médico</h4>
            <p class="card-text text-muted">Gestiona doctores y especialidades</p>
          </div>
        </div>
      </div>

      <!-- Pacientes -->
      <div class="col-md-4">
        <div class="card h-100 text-center p-4" role="button" onclick="window.location.href='pacientes.html'">
          <div class="card-body">
            <h1 class="display-4 mb-3">🧑‍🤝‍🧑</h1>
            <h4 class="card-title fw-bold">Pacientes</h4>
            <p class="card-text text-muted">Registra, busca y edita expedientes</p>
          </div>
        </div>
      </div>

      <!-- Citas -->
      <div class="col-md-4">
        <div class="card h-100 text-center p-4" role="button" onclick="window.location.href='citas.html'">
          <div class="card-body">
            <h1 class="display-4 mb-3">📅</h1>
            <h4 class="card-title fw-bold">Agenda de Citas</h4>
            <p class="card-text text-muted">Programa y administra citas médicas</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (!estaAutenticado()) {
      window.location.href = "index.html";
    } else {
      const claims = decodificarToken();
      const rol = claims.rol || "Usuario";
      const email = claims.email || "Usuario";

      document.getElementById("bienvenida").textContent = `Bienvenido, ${email}`;
      document.getElementById("navInfo").textContent = `${email} (${rol})`;

      if (rol === "Admin") {
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block");
      }
    }
  </script>
</body>
</html>
