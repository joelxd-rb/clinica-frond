<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes – Clínica</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
    nav { background: #1d4ed8; color: #fff; padding: .9rem 1.5rem;
          display: flex; align-items: center; justify-content: space-between; }
    nav a { color:#fff; text-decoration:none; background:rgba(255,255,255,.15);
            padding:.3rem .75rem; border-radius:6px; font-size:.85rem; margin-left:.5rem; }
    main { max-width: 980px; margin: 2rem auto; padding: 0 1rem; }
    .header { display:flex; justify-content:space-between; align-items:center;
              margin-bottom:1.25rem; flex-wrap:wrap; gap:.75rem; }
    h2 { color: #1e293b; }
    .controls { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
    .search-input { padding:.55rem .9rem; border:1px solid #d1d5db; border-radius:8px; font-size:.9rem; width:240px; }
    .btn-primary { background:#1d4ed8; color:#fff; padding:.55rem 1.1rem;
                   border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:.9rem; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px;
            overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    th { background:#1d4ed8; color:#fff; padding:.75rem 1rem; text-align:left; font-size:.85rem; }
    td { padding:.7rem 1rem; border-bottom:1px solid #e2e8f0; font-size:.9rem; color:#374151; }
    tr:last-child td { border-bottom:none; }
    td a { color:#1d4ed8; text-decoration:none; font-weight:500; }
    td a:hover { text-decoration:underline; }
    /* Modal */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
    .modal-backdrop.activo { display:flex; }
    .modal { background:#fff; border-radius:14px; padding:2rem; width:500px; max-width:95vw; max-height:90vh; overflow-y:auto; }
    .modal h3 { color:#1e293b; margin-bottom:1.25rem; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
    label { display:block; font-size:.85rem; color:#374151; margin-bottom:.25rem; font-weight:500; }
    input, select, textarea { width:100%; padding:.55rem .85rem; border:1px solid #d1d5db;
            border-radius:8px; font-size:.9rem; margin-bottom:.85rem; font-family:inherit; }
    textarea { resize:vertical; min-height:70px; }
    .actions { display:flex; gap:.75rem; }
    .btn-cancel { flex:1; padding:.65rem; background:#f1f5f9; border:1px solid #d1d5db; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn-submit { flex:1; padding:.65rem; background:#1d4ed8; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
    .error-msg { background:#fee2e2; color:#b91c1c; border-radius:8px; padding:.65rem 1rem; margin-bottom:1rem; font-size:.875rem; display:none; }
    #cargando { text-align:center; padding:2rem; color:#94a3b8; }
  </style>
</head>
<body>
  <nav>
    <h1 style="color:#fff;font-size:1rem">🧑‍🤝‍🧑 Pacientes</h1>
    <div><a href="dashboard.html">⬅ Dashboard</a><a href="#" onclick="cerrarSesion()">Salir</a></div>
  </nav>

  <main>
    <div class="header">
      <h2>Directorio de Pacientes</h2>
      <div class="controls">
        <input class="search-input" id="inputBusqueda" type="text" placeholder="Buscar por nombre, teléfono o ID…">
        <button class="btn-primary" onclick="buscar()">🔍</button>
        <button class="btn-primary" onclick="abrirModal()">+ Nuevo</button>
      </div>
    </div>

    <div id="cargando">Cargando pacientes...</div>
    <table id="tablaWrap" style="display:none">
      <thead>
        <tr><th>Nombre</th><th>Fecha Nac.</th><th>Sexo</th><th>Teléfono</th><th>Acciones</th></tr>
      </thead>
      <tbody id="tablaCuerpo"></tbody>
    </table>
  </main>

  <!-- Modal: Nuevo / Editar Paciente -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h3 id="modalTitulo">➕ Nuevo Paciente</h3>
      <div class="error-msg" id="errorModal"></div>
      <form id="formPaciente">
        <input type="hidden" id="pacienteId">
        <div class="grid2">
          <div><label>Nombre(s)</label><input type="text" id="fNombre" required></div>
          <div><label>Apellidos</label><input type="text" id="fApellidos" required></div>
        </div>
        <div class="grid2">
          <div><label>Fecha de Nacimiento</label><input type="date" id="fFechaNac" required></div>
          <div><label>Sexo</label>
            <select id="fSexo">
              <option value="">— Seleccionar —</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>
        <label>Teléfono</label><input type="tel" id="fTelefono">
        <label>Dirección</label><textarea id="fDireccion"></textarea>
        <div class="actions">
          <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn-submit" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // ── Inicialización: verificar sesión y cargar pacientes ──────────────────
    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarTodos(); }

    /** Carga todos los pacientes sin filtro */
    async function cargarTodos() {
      try {
        const data = await apiGet("/pacientes");
        renderizarTabla(data);
      } catch (e) {
        document.getElementById("cargando").textContent = "Error: " + e.message;
      }
    }

    /** Busca pacientes por el texto del input */
    async function buscar() {
      const q = document.getElementById("inputBusqueda").value.trim();
      if (!q) return cargarTodos();
      try {
        const data = await apiGet(`/pacientes/buscar?q=${encodeURIComponent(q)}`);
        renderizarTabla(data);
      } catch (e) { alert("Error: " + e.message); }
    }

    // Buscar también al presionar Enter
    document.getElementById("inputBusqueda").addEventListener("keydown", (e) => {
      if (e.key === "Enter") buscar();
    });

    /**
     * Renderiza la tabla de pacientes.
     * @param {Array} pacientes
     */
    function renderizarTabla(pacientes) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "table";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!pacientes.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#94a3b8">Sin resultados</td></tr>`;
        return;
      }

      pacientes.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><a href="paciente-detalle.html?id=${p.id_paciente}">${p.nombre} ${p.apellidos}</a></td>
          <td>${p.fecha_nacimiento || "—"}</td>
          <td>${p.sexo || "—"}</td>
          <td>${p.telefono || "—"}</td>
          <td>
            <a href="paciente-detalle.html?id=${p.id_paciente}">Ver</a> &nbsp;|&nbsp;
            <a href="#" onclick="abrirEdicion(${JSON.stringify(p).replace(/"/g, '&quot;')})">Editar</a>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    // ── Modal ────────────────────────────────────────────────────────────────
    function abrirModal() {
      document.getElementById("pacienteId").value = "";
      document.getElementById("modalTitulo").textContent = "➕ Nuevo Paciente";
      document.getElementById("formPaciente").reset();
      document.getElementById("modalBackdrop").classList.add("activo");
    }

    /** Abre el modal en modo edición con los datos del paciente seleccionado */
    function abrirEdicion(p) {
      document.getElementById("pacienteId").value  = p.id_paciente;
      document.getElementById("modalTitulo").textContent = "✏️ Editar Paciente";
      document.getElementById("fNombre").value      = p.nombre;
      document.getElementById("fApellidos").value   = p.apellidos;
      document.getElementById("fFechaNac").value    = p.fecha_nacimiento;
      document.getElementById("fSexo").value        = p.sexo || "";
      document.getElementById("fTelefono").value    = p.telefono || "";
      document.getElementById("fDireccion").value   = p.direccion || "";
      document.getElementById("modalBackdrop").classList.add("activo");
    }

    function cerrarModal() { document.getElementById("modalBackdrop").classList.remove("activo"); }

    document.getElementById("formPaciente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn    = document.getElementById("btnGuardar");
      errDiv.style.display = "none";
      btn.disabled = true; btn.textContent = "Guardando...";

      const id   = document.getElementById("pacienteId").value;
      const body = {
        nombre:           document.getElementById("fNombre").value,
        apellidos:        document.getElementById("fApellidos").value,
        fecha_nacimiento: document.getElementById("fFechaNac").value,
        sexo:             document.getElementById("fSexo").value || null,
        telefono:         document.getElementById("fTelefono").value || null,
        direccion:        document.getElementById("fDireccion").value || null,
      };

      try {
        if (id) {
          // Edición: PUT al endpoint con el ID del paciente
          await apiPut(`/pacientes/${id}`, body);
        } else {
          // Creación: POST al endpoint de pacientes
          await apiPost("/pacientes", body);
        }
        cerrarModal();
        cargarTodos();
      } catch (err) {
        errDiv.textContent = "⚠️ " + err.message;
        errDiv.style.display = "block";
      } finally {
        btn.disabled = false; btn.textContent = "Guardar";
      }
    });
  </script>
</body>
</html>
