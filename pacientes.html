<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Pacientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="#"><i class="bi bi-people-fill"></i> Directorio de Pacientes</a>
      <div class="d-flex align-items-center gap-3">
        <a href="dashboard.html" class="btn btn-outline-light btn-sm fw-bold"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <button class="btn btn-light btn-sm fw-bold" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <div class="d-flex gap-2 w-50">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
          <input type="text" id="busqueda" class="form-control border-start-0 ps-0" placeholder="Buscar por nombre, teléfono..." onkeyup="if(event.key==='Enter') buscarPaciente()">
        </div>
        <button class="btn btn-outline-primary fw-bold px-4" onclick="buscarPaciente()">Buscar</button>
      </div>
      <button class="btn btn-primary fw-bold" onclick="abrirOffcanvas()"><i class="bi bi-person-plus-fill"></i> Nuevo Paciente</button>
    </div>

    <div id="cargando">
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
      <div class="skeleton skeleton-row"></div>
    </div>

    <div class="table-container" id="tablaWrap" style="display:none">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Nombre Completo</th>
              <th>Fecha Nac.</th>
              <th>Sexo</th>
              <th>Teléfono</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpo"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Offcanvas -->
  <div class="offcanvas offcanvas-end shadow" tabindex="-1" id="offcanvasPaciente" style="width: 450px;">
    <div class="offcanvas-header bg-light">
      <h5 class="offcanvas-title fw-bold" id="modalTitulo"><i class="bi bi-person-plus"></i> Nuevo Paciente</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div class="alert alert-danger d-none" id="errorModal"></div>
      <form id="formPaciente">
        <input type="hidden" id="pacienteId">
        
        <h6 class="text-muted mb-3 fw-bold">Datos Personales</h6>
        <div class="form-floating mb-3">
          <input type="text" id="fNombre" class="form-control" placeholder="Nombre" required>
          <label for="fNombre">Nombre(s)</label>
        </div>
        <div class="form-floating mb-3">
          <input type="text" id="fApellidos" class="form-control" placeholder="Apellidos" required>
          <label for="fApellidos">Apellidos</label>
        </div>
        
        <div class="row g-2 mb-3">
          <div class="col-7">
            <div class="form-floating">
              <input type="date" id="fFechaNac" class="form-control" required>
              <label for="fFechaNac">F. Nacimiento</label>
            </div>
          </div>
          <div class="col-5">
            <div class="form-floating">
              <select id="fSexo" class="form-select" aria-label="Sexo">
                <option value="">(No exp.)</option>
                <option>Femenino</option>
                <option>Masculino</option>
                <option>Otro</option>
              </select>
              <label for="fSexo">Sexo</label>
            </div>
          </div>
        </div>

        <h6 class="text-muted mb-3 fw-bold mt-4">Contacto y Ubicación</h6>
        <div class="form-floating mb-3">
          <input type="tel" id="fTelefono" class="form-control" placeholder="Teléfono">
          <label for="fTelefono">Teléfono</label>
        </div>
        <div class="form-floating mb-4">
          <textarea id="fDireccion" class="form-control" placeholder="Dirección Completa" style="height: 80px"></textarea>
          <label for="fDireccion">Dirección Completa</label>
        </div>
        
        <div class="d-flex gap-2 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary w-50 fw-bold" data-bs-dismiss="offcanvas">Cancelar</button>
          <button type="submit" class="btn btn-primary w-50 fw-bold" id="btnGuardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    let pacienteOffcanvas;

    document.addEventListener("DOMContentLoaded", () => {
      pacienteOffcanvas = new bootstrap.Offcanvas(document.getElementById('offcanvasPaciente'));
    });

    if (!estaAutenticado()) { window.location.href = "index.html"; } else { cargarTodos(); }

    async function cargarTodos() {
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";
      try {
        const pacientes = await apiGet("/pacientes");
        renderizarTabla(pacientes);
      } catch (e) { document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
    }

    async function buscarPaciente() {
      const q = document.getElementById("busqueda").value.trim();
      if (!q) return cargarTodos();
      document.getElementById("cargando").style.display = "block";
      document.getElementById("tablaWrap").style.display = "none";
      try {
        const pacientes = await apiGet(`/pacientes?buscar=${encodeURIComponent(q)}`);
        renderizarTabla(pacientes);
      } catch (e) { document.getElementById("cargando").innerHTML = `<div class="alert alert-danger">${e.message}</div>`; }
    }

    function renderizarTabla(pacientes) {
      document.getElementById("cargando").style.display = "none";
      document.getElementById("tablaWrap").style.display = "block";
      const tbody = document.getElementById("tablaCuerpo");
      tbody.innerHTML = "";

      if (!pacientes.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Sin resultados</td></tr>`;
        return;
      }

      pacientes.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="fw-bold"><a href="paciente-detalle.html?id=${p.id}" class="text-primary text-decoration-none"><i class="bi bi-person-fill text-muted me-1"></i> ${p.nombre} ${p.apellidos}</a></td>
          <td><i class="bi bi-calendar3 text-muted me-1"></i> ${p.fecha_nacimiento || "—"}</td>
          <td><span class="badge bg-light text-dark border">${p.sexo || "—"}</span></td>
          <td><i class="bi bi-telephone text-muted me-1"></i> ${p.telefono || "—"}</td>
          <td class="text-end">
            <a href="paciente-detalle.html?id=${p.id}" class="btn btn-sm btn-outline-primary fw-bold me-2" title="Ver Expediente"><i class="bi bi-folder2-open"></i></a>
            <a href="#" class="text-secondary text-decoration-none me-3" title="Editar" onclick="abrirEdicion(${JSON.stringify(p).replace(/"/g, '&quot;')}); return false;"><i class="bi bi-pencil-square fs-5"></i></a>
            <a href="#" class="text-danger text-decoration-none" title="Eliminar" onclick="eliminarPaciente('${p.id}'); return false;"><i class="bi bi-trash fs-5"></i></a>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    async function eliminarPaciente(id) {
      if (!confirm("¿Seguro que deseas eliminar este paciente permanentemente? Se eliminarán también todas sus citas e historial.")) return;
      try {
        await apiDelete(`/pacientes/${id}`);
        cargarTodos();
      } catch (e) { alert("Error: " + e.message); }
    }

    function abrirOffcanvas() {
      document.getElementById("pacienteId").value = "";
      document.getElementById("modalTitulo").innerHTML = `<i class="bi bi-person-plus"></i> Nuevo Paciente`;
      document.getElementById("formPaciente").reset();
      document.getElementById("errorModal").classList.add("d-none");
      pacienteOffcanvas.show();
    }

    function abrirEdicion(p) {
      document.getElementById("pacienteId").value = p.id;
      document.getElementById("modalTitulo").innerHTML = `<i class="bi bi-pencil-square"></i> Editar Paciente`;
      document.getElementById("fNombre").value = p.nombre;
      document.getElementById("fApellidos").value = p.apellidos;
      document.getElementById("fFechaNac").value = p.fecha_nacimiento;
      document.getElementById("fSexo").value = p.sexo || "";
      document.getElementById("fTelefono").value = p.telefono || "";
      document.getElementById("fDireccion").value = p.direccion || "";
      document.getElementById("errorModal").classList.add("d-none");
      pacienteOffcanvas.show();
    }

    document.getElementById("formPaciente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errDiv = document.getElementById("errorModal");
      const btn = document.getElementById("btnGuardar");
      errDiv.classList.add("d-none");
      btn.disabled = true; btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;

      const id = document.getElementById("pacienteId").value;
      const body = {
        nombre: document.getElementById("fNombre").value,
        apellidos: document.getElementById("fApellidos").value,
        fecha_nacimiento: document.getElementById("fFechaNac").value,
        sexo: document.getElementById("fSexo").value || null,
        telefono: document.getElementById("fTelefono").value || null,
        direccion: document.getElementById("fDireccion").value || null,
      };

      try {
        if (id) await apiPut(`/pacientes/${id}`, body);
        else await apiPost("/pacientes", body);
        pacienteOffcanvas.hide();
        cargarTodos();
      } catch (err) {
        errDiv.textContent = err.message;
        errDiv.classList.remove("d-none");
      } finally {
        btn.disabled = false; btn.textContent = "Guardar";
      }
    });
  </script>
</body>
</html>
